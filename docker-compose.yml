version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    ports:
      - "5672:5672" # Porta padrão AMQP para comunicação do Spring
      - "15672:15672" # Porta para o painel de gerenciamento (Acesse http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest