spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    initialization-mode: always

  jpa:
    hibernate:
      ddl-auto: create
      import-files: import.sql
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
security:
  client-id: myclientid
  client-secret: myclientsecret
  jwt:
    duration: 86400
cors:
  origins: http://localhost:3000, http://localhost:5173