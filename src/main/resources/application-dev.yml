spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    initialization-mode: always

  jpa:
    hibernate:
      ddl-auto: create
      import-files: import.sql
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

rabbitmq:
  exchangeName: email.exchange
  queueWelcome: email.welcome
  queueInvestimentRemoved: email.investiment.removed

security:
  jwt:
    duration: 200
    refresh-duration: 900
    secret: myclientsecret
cors:
  origins: http://localhost:3000, http://localhost:5173