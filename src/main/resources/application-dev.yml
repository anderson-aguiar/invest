## Infos do App, usado pelo Actuator
info:
  app:
    name: api-gestao-investimentos-pessoais
    version: 1.0.0
    description: API de Gestão de Investimentos Pessoais
## ----------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    initialization-mode: always
  jpa:
    hibernate:
      ddl-auto: create
      import-files: import.sql
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

## Configs do Actuator ##
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

  health:
    db:
      enabled: true
    rabbit:
      enabled: true
##------------------------
## Values para exchange e queues do rabbit ##
rabbitmq:
  exchangeName: email.exchange
  queueWelcome: email.welcome
  queueInvestimentRemoved: email.investiment.removed

## Values para security
security:
  jwt:
    duration: 200
    refresh-duration: 900
    secret: myclientsecret

cors:
  origins: http://localhost:3000, http://localhost:5173
